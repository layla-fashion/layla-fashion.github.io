<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>متجر الأزياء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f6; --ink:#14263a; --muted:#5a6b7d; --card:#fff;
  --accent:#1f5f8b; --accent-ink:#fff; --line:#d3dce6; --ok:#1c7c4d;
  font-family:"Tajawal",Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box}
html{background:#e9e4f7}
body{margin:0;min-height:100vh;color:var(--ink);line-height:1.6;
  background:
    radial-gradient(60% 40% at 90% 0%,rgba(255,214,224,.85),transparent 70%),
    radial-gradient(55% 40% at 5% 35%,rgba(205,225,247,.9),transparent 70%),
    radial-gradient(60% 45% at 85% 90%,rgba(226,214,247,.9),transparent 70%),
    linear-gradient(160deg,#fdf0f3 0%,#ece8f8 50%,#dcebf7 100%);
  background-repeat:no-repeat}
.item{box-shadow:0 6px 18px rgba(31,95,139,.10)}
header{padding:48px 20px 24px;max-width:960px;margin:auto}
header h1{font-size:clamp(2rem,7vw,3.4rem);font-weight:800;margin:0 0 8px;line-height:1.15}
header p{margin:0;color:var(--muted);font-size:1.05rem}
main{max-width:960px;margin:auto;padding:8px 20px 56px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.swatch{aspect-ratio:2/3;display:grid;place-items:center;overflow:hidden}
.swatch img{width:100%;height:100%;object-fit:cover;object-position:center 15%;display:block}
#hero{max-width:960px;margin:0 auto 20px;padding:0 20px}
#hero img{width:100%;height:clamp(160px,38vw,320px);object-fit:cover;border-radius:18px;display:block}
.swatch svg{width:84px;height:84px;fill:rgba(255,255,255,.92)}
.info{padding:14px;display:flex;flex-direction:column;gap:4px;flex:1}
.info h2{font-size:1.05rem;margin:0}
.info .sizes{color:var(--muted);font-size:.9rem}
.price{font-weight:800;font-size:1.15rem;margin-top:4px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
.order{margin-top:auto;background:var(--accent);color:var(--accent-ink);padding:11px;font-weight:800}
.order:hover{background:#174a6d}
:focus-visible{outline:3px solid #e8a33d;outline-offset:2px}
dialog{border:0;border-radius:16px;padding:0;width:min(440px,92vw);color:var(--ink)}
dialog::backdrop{background:rgba(20,38,58,.55)}
form{padding:22px;display:grid;gap:12px}
form h3{margin:0;font-size:1.25rem}
.sum{margin:0;color:var(--muted)}
label{display:grid;gap:4px;font-weight:500;font-size:.95rem}
input,select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.send{background:var(--ok);color:#fff;padding:13px;font-weight:800;font-size:1.05rem}
.cancel{background:transparent;color:var(--muted);padding:6px}
footer{text-align:center;color:var(--muted);padding:0 20px 32px;font-size:.9rem}
@media (prefers-reduced-motion:no-preference){.item{transition:transform .15s}.item:hover{transform:translateY(-3px)}}
</style>
</head>
<body>
<header>
  <h1 id="storeName"></h1>
  <p id="tagline"></p>
</header>
<section id="hero" hidden></section>
<main><div class="grid" id="grid"></div></main>
<footer>الدفع والتوصيل نتفق عليهما معك مباشرة في محادثة واتساب.</footer>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h3>إتمام الطلب</h3>
    <p class="sum" id="sum"></p>
    <div class="row">
      <label>المقاس<select id="size" required></select></label>
      <label>الكمية<input id="qty" type="number" min="1" max="20" value="1" required></label>
    </div>
    <label>الاسم الكامل<input id="name" autocomplete="name" required minlength="3"></label>
    <label>الولاية أو المنطقة<input id="region" required></label>
    <label>رقم الهاتف<input id="phone" type="tel" inputmode="tel" autocomplete="tel" required pattern="[0-9+ ]{8,16}" placeholder="مثال: 0550000000"></label>
    <button class="send" type="submit">أرسل الطلب عبر واتساب</button>
    <button class="cancel" type="button" id="close">إلغاء</button>
  </form>
</dialog>

<script>
/* ===== إعدادات المتجر: عدّل هذا القسم فقط ===== */
const STORE_NAME = "متجر الأزياء";
const TAGLINE    = "ملابس جاهزة. اختر القطعة وأرسل طلبك في دقيقة.";
const WHATSAPP   = "213676082016";   // رقم الزبون بصيغة دولية بدون + أو أصفار
const CURRENCY   = "دج";
/* صورة الغلاف الكبيرة (اختيارية): اسم ملف الصورة مثل "images/hero.jpg" */
const HERO_IMAGE = "";
/* image: اسم صورة المنتج مثل "images/shirt1.jpg". اتركها فارغة لتظهر بطاقة ملونة */
const PRODUCTS = [
  {name:"طقم جاكيت وتنورة رمادي", price:7800, sizes:["S","M","L","XL"], color:"#6b7280", image:IMG.p1},
  {name:"معطف بني وفستان صوفي",  price:9500, sizes:["S","M","L"],      color:"#7a5640", image:IMG.p2},
  {name:"طقم بناتي وردي",         price:2600, sizes:["6","8","10","12"], color:"#f3a6b5", image:IMG.p3},
  {name:"طقم بناتي أخضر هادئ",    price:4200, sizes:["8","10","12","14"], color:"#9bb8a6", image:IMG.p4},
  {name:"طقم رياضي بني",          price:5400, sizes:["S","M","L","XL"], color:"#4a2f25", image:IMG.p5}
];
/* ============================================== */

const $ = id => document.getElementById(id);
const shirt = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3 2 6l2 5 3-1v11h10V10l3 1 2-5-6-3a4 4 0 0 1-8 0z"/></svg>';
let current = null;

document.title = STORE_NAME;
$("storeName").textContent = STORE_NAME;
$("tagline").textContent = TAGLINE;
if (HERO_IMAGE) { $("hero").innerHTML = `<img src="${HERO_IMAGE}" alt="${STORE_NAME}">`; $("hero").hidden = false; }

$("grid").innerHTML = PRODUCTS.map((p,i)=>`
  <article class="item">
    <div class="swatch" style="background:${p.color}">${p.image ? `<img src="${p.image}" alt="${p.name}" loading="lazy">` : shirt}</div>
    <div class="info">
      <h2>${p.name}</h2>
      <span class="sizes">المقاسات: ${p.sizes.join(" / ")}</span>
      <span class="price">${p.price.toLocaleString("en-US")} ${CURRENCY}</span>
      <button class="order" data-i="${i}">اطلب الآن</button>
    </div>
  </article>`).join("");

$("grid").addEventListener("click", e=>{
  const b = e.target.closest(".order"); if(!b) return;
  current = PRODUCTS[b.dataset.i];
  $("sum").textContent = current.name + " — " + current.price.toLocaleString("en-US") + " " + CURRENCY;
  $("size").innerHTML = current.sizes.map(s=>`<option>${s}</option>`).join("");
  $("dlg").showModal();
});
$("close").onclick = ()=> $("dlg").close();

$("form").addEventListener("submit", e=>{
  e.preventDefault();
  const qty = +$("qty").value;
  const total = (current.price * qty).toLocaleString("en-US");
  const msg = [
    "طلب جديد",
    "المنتج: " + current.name,
    "المقاس: " + $("size").value,
    "الكمية: " + qty,
    "الإجمالي: " + total + " " + CURRENCY,
    "الاسم: " + $("name").value.trim(),
    "الولاية: " + $("region").value.trim(),
    "الهاتف: " + $("phone").value.trim()
  ].join("\n");
  const url = "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(msg);
  $("dlg").close();
  $("form").reset();
  window.location.href = url;
});
</script>
</body>
</html>
